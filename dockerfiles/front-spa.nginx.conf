server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ^~ /assets/ {
    try_files $uri =404;
  }

  location = /share {
    try_files $uri /share/index.html;
  }

  location ^~ /share/ {
    try_files $uri $uri/ /share/index.html;
  }

  location = /oauth {
    try_files $uri /oauth/index.html;
  }

  location ^~ /oauth/ {
    try_files $uri $uri/ /oauth/index.html;
  }

  location ~ ^/w/[^/]+/oauth(?:/|$) {
    try_files $uri $uri/ /oauth/index.html;
  }

  location = /email {
    try_files $uri /email/index.html;
  }

  location ^~ /email/ {
    try_files $uri $uri/ /email/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
